<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1013">
<meta name="color-scheme" content="dark">
<title>Shortcut to Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1013; --card:#141A1F; --card2:#1A2128; --ink:#E7EBEE; --muted:#87939C; --line:#252E36;
  --plate:#5E9BFF; --plate-ink:#06101D; --flag:#F2C14E; --good:#5CC389; --bad:#F07B70; --input:#0C1013;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 'Barlow',system-ui,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
.wrap{max-width:520px;margin:0 auto;padding:0 12px}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
.tabs{display:flex;gap:2px;margin:10px 0 8px;background:var(--card);border-radius:9px;padding:3px;position:sticky;top:6px;z-index:5;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 13px 'Barlow',sans-serif;padding:7px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--plate)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--plate);outline-offset:1px}
.hero{padding:4px 0 0}
.hero .big{font:700 34px/1 'Barlow Condensed',sans-serif}
.hero .sub{font:500 14px 'Barlow',sans-serif;color:var(--muted);margin-top:3px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 0 3px}
.strip .wk{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.strip i{height:5px;background:var(--line);border-radius:1px;display:block}
.strip i.done{background:var(--plate)} .strip i.now{background:var(--flag)}
.striplabel{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.nudge{margin:10px 0;padding:8px 11px;border-left:3px solid var(--flag);background:var(--card);border-radius:0 8px 8px 0;font-size:13px}
.nudge.hard{border-color:var(--bad)}
.tech{margin:10px 0;padding:8px 11px;border-radius:8px;background:var(--card);border:1px solid var(--flag);color:var(--flag);font-weight:600;font-size:13px}
.tech small{display:block;font-weight:400;margin-top:1px;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0}
.card h3{font-size:18px;line-height:1.15}
details.card summary{font-size:13px;cursor:pointer;color:var(--muted)}
details.card summary b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;color:var(--muted);font-size:12px;margin:3px 0 6px;align-items:center}
.meta b{color:var(--ink)}
.star{color:var(--flag);font-weight:700;font-size:13px}
.warn{font-size:12px;color:var(--bad);margin:2px 0 6px}
.use{font:600 11px 'Barlow',sans-serif;border:1px solid var(--plate);color:var(--plate);background:none;border-radius:5px;padding:2px 7px;cursor:pointer}
.row{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:end;margin:4px 0}
.row.x{grid-template-columns:1fr 1fr 1fr;padding:6px;background:var(--card2);border-radius:8px;border:1px dashed var(--flag)}
.row .lab{font-weight:600;color:var(--muted);font-size:12px;padding-bottom:8px}
label.f{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-bottom:1px}
input,select,textarea{width:100%;font:500 16px 'Barlow',sans-serif;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:7px;padding:6px 9px;height:36px}
textarea{min-height:56px;height:auto}
.flag{font-size:12px;margin-top:3px;min-height:1em;color:var(--muted)}
.flag.up{color:var(--bad)} .flag.down{color:var(--good)}
.primary{width:100%;border:0;background:var(--plate);color:var(--plate-ink);font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.03em;padding:10px;border-radius:9px;cursor:pointer;margin-top:8px}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);font:600 13px 'Barlow',sans-serif;padding:7px 12px;border-radius:7px;cursor:pointer}
.status{font-size:11px;color:var(--muted);margin:5px 0 0}
.status.bad{color:var(--bad)}
.spark{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.spark:first-of-type{border-top:0}
.spark svg{flex:none}
.pr{display:inline-block;background:var(--flag);color:#1b1500;font-weight:700;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
pre{white-space:pre-wrap;word-break:break-word;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.5 ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:9}
[hidden]{display:none!important}
.sets-note{font-size:11px;color:var(--muted)}
.how{display:flex;gap:12px;margin:2px 0 1px;font-size:12px;font-weight:600}
.how a{color:var(--plate);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" aria-selected="false" data-tab="progress">Progress</button>
    <button role="tab" aria-selected="false" data-tab="setup">Setup</button>
  </div>
  <section id="today"></section>
  <section id="progress" hidden></section>
  <section id="setup" hidden></section>
</div>

<script>
/* ---------- PROGRAM DATA (Jim Stoppani, 12-Week Shortcut to Size) ---------- */
const REPS=["12-15","9-11","6-8","3-5"], CALF=["25-30","15-20","10-14","6-9"];
const WK=[
 {n:"Chest, triceps, calves",
  main:[
   [["Bench Press",4],["Incline Bench Press",3],["Incline Dumbbell Flye",3],["Cable Crossover",3],["Triceps Pressdown",3],["Lying Triceps Extension",3],["Cable Overhead Triceps Extension",3]],
   [["Bench Press",4],["Incline Dumbbell Press",3],["Dumbbell Flye",3],["Incline Cable Flye",3],["Triceps Pressdown",3],["Dumbbell Overhead Triceps Extension",3],["Cable Lying Triceps Extension",3]],
   [["Bench Press",4],["Reverse-Grip Incline Dumbbell Press",3],["Incline Dumbbell Flye",3],["Cable Crossover",3],["Triceps Pressdown",3],["One-Arm Overhead Cable Triceps Extension",3],["Close-Grip Bench Press",3]]],
  calves:[["Standing Calf Raise",4],["Seated Calf Raise",4]]},
 {n:"Back, biceps, abs",
  main:[
   [["Dumbbell Bent-Over Row",4],["Wide-Grip Pulldown",3],["Standing Pulldown",3],["Straight Arm Pulldown",3],["Barbell Curl",4],["Dumbbell Incline Curl",3],["One-Arm High Cable Curl",3]],
   [["Dumbbell Bent-Over Row",4],["Behind-Neck Pulldown",3],["Seated Cable Row",3],["Reverse-Grip Pulldown",3],["Barbell Curl",4],["Preacher Curl",3],["Behind-Back Cable Curl",3]],
   [["Dumbbell Bent-Over Row",4],["Wide-Grip Pulldown",3],["Straight-Arm Pulldown",3],["Seated Cable Row",3],["Barbell Curl",4],["Incline Cable Curl",3],["Dumbbell Concentration Curl",3]]]},
 {n:"Shoulders, traps, calves",
  main:[
   [["Dumbbell Shoulder Press",4],["Dumbbell Lateral Raise",3],["One-Arm Cable Front Raise",3],["High Cable Rear Delt Fly",3],["Dumbbell Shrug",4]],
   [["Dumbbell Shoulder Press",4],["Smith Machine Upright Row",3],["One-Arm Cable Lateral Raise",3],["Bent-Over Lateral Raise",3],["Barbell Shrug",4]],
   [["Dumbbell Shoulder Press",4],["Dumbbell Lateral Raise",3],["Dumbbell Upright Row",3],["Bent-Over Lateral Raise",3],["One-Arm Smith Machine Shrug",4]]],
  calves:[["Seated Calf Raise",4],["Leg Press Calf Raise",4]]},
 {n:"Legs and abs",
  main:[
   [["Squat",4],["One-Leg Leg Press",3],["Leg Extension",3],["Romanian Deadlift",4],["Lying Leg Curl",3]],
   [["Squat",4],["Front Squat",3],["Leg Extension",3],["Romanian Deadlift",4],["Seated Leg Curl",3]],
   [["Squat",4],["Leg Press",3],["Leg Extension",3],["Romanian Deadlift",4],["Lying Leg Curl",3]]]}
];
const ANCHORS=["Bench Press","Triceps Pressdown","Dumbbell Bent-Over Row","Barbell Curl","Dumbbell Shoulder Press","Squat"];
const BIG=new Set(["Squat","Romanian Deadlift","Leg Press","Bench Press"]);
const ab=(name,sets,reps)=>({name,sets,reps});
const hold=(name,secs)=>({name,sets:3,reps:String(secs),unit:"sec"});
function abs2(cw){return [
 [ab("Hip Thrust",3,"20-30"),ab("Crunch",3,"20-30"),ab("Oblique Crunch",3,"20-30")],
 [ab("Hanging Leg Raise",3,"15-19"),ab("Weighted Crunch",3,"15-19"),ab("Dumbbell Side Bend",3,"15-19")],
 [ab("Weighted Hip Thrust",3,"10-14"),ab("Cable Crunch",3,"10-14"),ab("Cable Oblique Crunch",3,"10-14")],
 [ab("Smith Machine Hip Thrust",3,"6-9"),ab("Machine Crunch",3,"6-9"),ab("Band Roundhouse Elbow",3,"6-9")]][cw];}
function abs4(cw,ph){const p=[60,75,90][ph], q=[75,90,105][ph];return [
 [ab("Hip Thrust",3,"20-30"),ab("Crunch",3,"20-30"),hold("Plank",p)],
 [ab("Hanging Leg Raise",3,"15-19"),ab("Weighted Crunch",3,"15-19"),hold("Side Plank",p)],
 [ab("Weighted Hip Thrust",3,"10-14"),ab("Cable Crunch",3,"10-14"),ab("Cable Woodchopper",3,"10-14")],
 [ab("Smith Machine Hip Thrust",3,"6-9"),ab("Machine Crunch",3,"6-9"),hold("Plank",q)]][cw];}

function build(idx){
  const week=Math.ceil(idx/4), cw=(week-1)%4, ph=Math.floor((week-1)/4), wi=(idx-1)%4, w=WK[wi];
  const list=w.main[ph].map(([name,sets])=>({name,sets,reps:REPS[cw]}));
  if(w.calves) w.calves.forEach(([name,sets])=>list.push({name,sets,reps:CALF[cw]}));
  if(wi===1) list.push(...abs2(cw));
  if(wi===3) list.push(...abs4(cw,ph));
  return {idx,week,cw,ph,wi,title:w.n,tech:cw<2?"rest":"drop",list};
}

/* ---------- STATE ---------- */
const $=s=>document.querySelector(s);
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const cfg={url:ls('sts_url',''),token:ls('sts_token',''),start:+ls('sts_start','9')};
let server=JSON.parse(ls('sts_cache','{"sets":[],"sessions":[]}'));
let pending=JSON.parse(ls('sts_pending','[]'));
let S=null, draft={}, online=null, override=null;

const num=v=>+v||0;
const round25=x=>Math.round(x/2.5)*2.5;
const allSets=()=>{const have=new Set(server.sessions.map(s=>+s.session));
  const p=pending.filter(x=>!have.has(x.session)).flatMap(x=>x.sets.map(s=>({...s,session:x.session,week:x.week,phase:x.phase})));
  return server.sets.map(s=>({...s,session:+s.session,week:+s.week,weight:num(s.weight),reps:num(s.reps)})).concat(p);};
const allSessions=()=>{const have=new Set(server.sessions.map(s=>+s.session));
  return server.sessions.map(s=>({...s,session:+s.session})).concat(pending.filter(x=>!have.has(x.session)).map(x=>({session:x.session,week:x.week,workout:x.workout,date:x.date,feel:x.feel,notes:x.notes})));};
function nextIdx(){const ss=allSessions();const last=ss.length?Math.max(...ss.map(s=>s.session)):cfg.start-1;return last+1;}

/* ---------- LOAD SUGGESTIONS ---------- */
function perSession(ex,exclude){
  const m={};
  allSets().filter(r=>r.exercise===ex&&r.weight>0&&r.session!==exclude).forEach(r=>{
    m[r.session]=m[r.session]||{session:r.session,week:r.week,top:0,reps:[]};
    m[r.session].top=Math.max(m[r.session].top,r.weight);m[r.session].reps.push(r.reps);});
  return Object.values(m).sort((a,b)=>a.session-b.session);
}
function suggest(ex,week,idx){
  const cw=(week-1)%4, ph=Math.floor((week-1)/4), h=perSession(ex,idx);
  if(!h.length) return null;
  const f={1:1.08,2:1.08,3:1.10};
  if(cw===0){
    const prev=h.filter(x=>Math.floor((x.week-1)/4)<ph&&(x.week-1)%4===0).pop();
    return prev?round25(prev.top+(BIG.has(ex)?5:2.5)):null;
  }
  const same=h.filter(x=>Math.floor((x.week-1)/4)===ph&&x.week<week).pop();
  if(!same) return null;
  let w=same.top;for(let c=(same.week-1)%4+1;c<=cw;c++)w*=f[c];
  return round25(w);
}
function weekOneWeight(ex,ph,idx){
  const h=perSession(ex,idx).filter(x=>Math.floor((x.week-1)/4)===ph&&(x.week-1)%4===0).pop();
  return h?h.top:null;
}
const range=r=>r.split('-').map(Number);

/* ---------- TODAY ---------- */
const g=(ei,si,k)=>draft.v?.[`${ei}_${si}_${k}`]??'';
const saveDraft=()=>lset('sts_draft',JSON.stringify(draft));
function loadDraft(idx){try{const d=JSON.parse(ls('sts_draft','{}'));draft=d.idx===idx?d:{idx,v:{}}}catch(e){draft={idx,v:{}}} draft.v=draft.v||{};}

function renderToday(){
  const idx=override??nextIdx();
  const el=$('#today');
  if(idx>48){el.innerHTML=`<div class="hero"><div class="big">Done.</div><div class="sub">All 12 weeks logged.</div></div><p>Check the Progress tab and your Analysis sheet, then we set the next block.</p>`;return;}
  S=build(idx); loadDraft(idx);
  const ss=allSessions(); const lastS=ss.sort((a,b)=>a.session-b.session).at(-1);
  let nudge='';
  if(lastS&&lastS.date){const d=Math.floor((new Date(new Date().toLocaleDateString('en-CA'))-new Date(lastS.date))/864e5);
    if(d>=5) nudge=`<div class="nudge hard">${d} days since your last session. That is a skipped week in a 4-day program. No catch-up volume: do today's session as written and tell your coach what got in the way.</div>`;
    else if(d>=3) nudge=`<div class="nudge">${d} days since your last session. Keep the 4-a-week rhythm: Mon, Wed, Fri, Sat.</div>`;
    else if(d===0) nudge=`<div class="nudge">You already trained today. Today's next session can wait for your next gym day.</div>`;}
  const done=nextIdx()-1;
  let strip='';for(let w=0;w<12;w++){strip+='<div class="wk">';for(let d=0;d<4;d++){const n=w*4+d+1;strip+=`<i class="${n<=done?'done':''} ${n===idx?'now':''}"></i>`}strip+='</div>'}
  const techTxt=S.tech==='rest'
    ?['Rest-pause on the last set of every exercise','Take the last set to failure, rack it, rest 15 seconds, then go to failure again.']
    :['Drop set on the last set of every exercise','Take the last set to failure, immediately cut to your Week 1 weight for that exercise, go to failure again.'];
  let html=`<div class="hero"><div class="big">Week ${S.week} · Day ${S.wi+1}</div><div class="sub">${S.title} — Phase ${S.ph+1}, session ${idx} of 48</div></div>
  <div class="strip" aria-label="Program progress">${strip}</div>
  <div class="striplabel"><span>Week 1</span><span>Week 12</span></div>${nudge}
  <div class="tech">${techTxt[0]}<small>${techTxt[1]}</small></div>
  <details class="card" style="margin-top:6px"><summary><b>Jump to a different session</b></summary>
   <div class="row" style="grid-template-columns:1fr 1fr;margin-top:8px"><div><label class="f">Week</label><select id="ovW">${Array.from({length:12},(_,i)=>`<option ${i+1===S.week?'selected':''}>${i+1}</option>`).join('')}</select></div>
   <div><label class="f">Day</label><select id="ovD">${WK.map((w,i)=>`<option value="${i}" ${i===S.wi?'selected':''}>${i+1} · ${w.n}</option>`).join('')}</select></div></div>
   <button class="ghost" id="ovGo" style="margin-top:8px">Load it</button></details>`;
  S.list.forEach((e,ei)=>{
    const sug=e.unit?null:suggest(e.name,S.week,idx);
    const hist=e.unit?[]:perSession(e.name,idx), last=hist.at(-1);
    const anchor=ANCHORS.includes(e.name);
    const wo=!e.unit&&S.tech==='drop'?weekOneWeight(e.name,S.ph,idx):null;
    html+=`<div class="card" data-ei="${ei}"><h3>${e.name}${anchor?' <span class="star" title="Anchor lift: stays the same all 12 weeks">★</span>':''}</h3>
    <div class="how"><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(e.name+' exercise how to')}" target="_blank" rel="noopener">How to: images</a><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.name+' proper form')}" target="_blank" rel="noopener">How to: video</a></div>
    <div class="meta"><span><b>${e.sets} × ${e.reps}${e.unit?' sec':''}</b></span>
     ${sug?`<span>Target <b>${sug} kg</b> <button class="use" data-use="${ei}" data-w="${sug}">Fill all sets</button></span>`:(!e.unit?'<span>No target yet: pick a load you can finish the bottom of the range with 1–2 reps spare.</span>':'')}
     ${last?`<span>Last: <b>${last.top} kg</b> × ${last.reps.join(', ')}</span>`:''}</div>
    ${e.name==='Romanian Deadlift'?'<div class="warn">Back caution: light, flat back, controlled. Stop the set if you feel it in your lower back rather than hamstrings.</div>':''}`;
    for(let si=0;si<e.sets;si++){
      const lastSet=si===e.sets-1;
      html+=`<div class="row"><span class="lab">Set ${si+1}</span>
       ${e.unit?'<span></span>':`<div><label class="f">kg</label><input inputmode="decimal" type="number" step="0.5" min="0" data-k="${ei}_${si}_w" value="${g(ei,si,'w')}" placeholder="${sug??''}"></div>`}
       <div><label class="f">${e.unit?'seconds':'reps'}</label><input inputmode="numeric" type="number" min="0" data-k="${ei}_${si}_r" value="${g(ei,si,'r')}" placeholder="${e.unit?e.reps:range(e.reps)[0]}"></div></div>`;
      if(lastSet&&!e.unit){
        html+=S.tech==='rest'
         ?`<div class="row x"><span class="lab" style="grid-column:1/3">Rest-pause reps after 15 s</span><input inputmode="numeric" type="number" min="0" data-k="${ei}_${si}_xr" value="${g(ei,si,'xr')}"></div>`
         :`<div class="row x"><span class="lab">Drop</span><div><label class="f">kg</label><input inputmode="decimal" type="number" step="0.5" min="0" data-k="${ei}_${si}_xw" value="${g(ei,si,'xw')}" placeholder="${wo??''}"></div><div><label class="f">reps</label><input inputmode="numeric" type="number" min="0" data-k="${ei}_${si}_xr" value="${g(ei,si,'xr')}"></div></div>`;
      }
    }
    html+=`<div class="flag" id="flag${ei}"></div></div>`;
  });
  html+=`<div class="card"><label class="f">How did it feel? (1 = wrecked, 5 = strong)</label>
   <select id="feel"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${draft.feel==n?'selected':''}>${n}</option>`).join('')}</select>
   <label class="f" style="margin-top:10px">Notes (pain is not fatigue: if something hurts, write it here)</label>
   <textarea id="notes">${draft.notes||''}</textarea>
   <button class="primary" id="finish">Finish and save session</button>
   <div class="status ${online===false?'bad':''}" id="status"></div></div><div id="summary"></div>`;
  el.innerHTML=html; S.list.forEach((_,i)=>updateFlag(i)); setStatus();
}

function updateFlag(ei){
  const e=S.list[ei]; if(e.unit) return; const el=$('#flag'+ei); if(!el) return;
  const [lo,hi]=range(e.reps); const reps=[];
  for(let si=0;si<e.sets;si++){const r=num(g(ei,si,'r'));if(r)reps.push(r)}
  if(!reps.length){el.textContent='';el.className='flag';return;}
  if(reps[0]<lo){el.textContent=`Set 1 was ${reps[0]} reps, below ${lo}. Too heavy: drop about 5% next set.`;el.className='flag up';}
  else if(reps.length===e.sets&&reps.every(r=>r>hi)){el.textContent=`Every set cleared ${hi}. Too light: go up next time.`;el.className='flag down';}
  else if(reps[0]>hi+2){el.textContent=`Set 1 hit ${reps[0]}. Add weight on the next set.`;el.className='flag down';}
  else{el.textContent='In range.';el.className='flag';}
}

function e1rm(w,r){return w*(1+r/30)}
async function finish(){
  const rows=[];
  S.list.forEach((e,ei)=>{for(let si=0;si<e.sets;si++){const r=num(g(ei,si,'r'));if(!r)continue;const last=si===e.sets-1;
    rows.push({exercise:e.name,set:si+1,weight:e.unit?0:num(g(ei,si,'w')),reps:r,
      xWeight:last&&S.tech==='drop'?num(g(ei,si,'xw')):0,xReps:last?num(g(ei,si,'xr')):0,
      technique:last&&!e.unit?(S.tech==='rest'?'rest-pause':'drop set'):''});}});
  if(!rows.length){toast('Log at least one set first');return;}
  const date=new Date().toLocaleDateString('en-CA');
  const p={session:S.idx,week:S.week,phase:S.ph+1,workout:S.title,date,feel:$('#feel').value,notes:$('#notes').value,sets:rows};
  // PRs and flags before the new session joins the history
  const prs=[],flags=[];
  const names=[...new Set(rows.map(r=>r.exercise))];
  names.forEach(n=>{const prior=allSets().filter(r=>r.exercise===n&&r.weight>0&&r.session!==S.idx);
    const mine=rows.filter(r=>r.exercise===n&&r.weight>0);
    if(prior.length&&mine.length){const best=Math.max(...prior.map(r=>e1rm(r.weight,r.reps))), nb=mine.reduce((a,r)=>e1rm(r.weight,r.reps)>e1rm(a.weight,a.reps)?r:a);
      if(e1rm(nb.weight,nb.reps)>best*1.0001) prs.push(`${n}: ${nb.weight} kg × ${nb.reps}`);}
    const ex=S.list.find(e=>e.name===n); if(!ex.unit){const [lo,hi]=range(ex.reps);const rr=rows.filter(r=>r.exercise===n).map(r=>r.reps);
      if(rr[0]<lo) flags.push(`${n}: too heavy (set 1 = ${rr[0]})`); else if(rr.length>1&&rr.every(r=>r>hi)) flags.push(`${n}: too light`);}});
  pending=pending.filter(x=>x.session!==p.session);pending.push(p);lset('sts_pending',JSON.stringify(pending));
  lset('sts_draft','{}');
  const log=makeLog(p,prs,flags);
  $('#summary').innerHTML=`<div class="card"><h3>Session saved${prs.length?'<span class="pr">PR</span>':''}</h3>
   ${prs.length?`<p><b>PRs:</b><br>${prs.join('<br>')}</p>`:''}${flags.length?`<p><b>Load flags:</b><br>${flags.join('<br>')}</p>`:''}
   <pre id="logtxt">${log.replace(/</g,'&lt;')}</pre><button class="ghost" id="copy">Copy log</button>
   <p class="sets-note">Next up: ${S.idx<48?`Week ${build(S.idx+1).week} · Day ${build(S.idx+1).wi+1}, ${build(S.idx+1).title}`:'program complete'}.</p></div>`;
  $('#summary').scrollIntoView({behavior:'smooth'});
  override=null; await send(p); renderProgress();
}
function makeLog(p,prs,flags){
  let t=`Session ${p.session} | Week ${p.week} (Phase ${p.phase}) | ${p.workout} | ${p.date}\nTechnique: ${S.tech==='rest'?'rest-pause':'drop set'} on last set\n`;
  const by={};p.sets.forEach(r=>(by[r.exercise]=by[r.exercise]||[]).push(r));
  Object.entries(by).forEach(([n,rs])=>{t+=`${n}: `+rs.map(r=>{const u=/plank/i.test(n);let s=u?`${r.reps}s`:`${r.weight}kg x ${r.reps}`;
    if(r.technique==='rest-pause'&&r.xReps) s+=` + ${r.xReps} (RP)`; if(r.technique==='drop set'&&r.xReps) s+=` + ${r.xWeight}kg x ${r.xReps} (drop)`;return s}).join(', ')+'\n'});
  if(prs.length) t+=`PRs: ${prs.join('; ')}\n`; if(flags.length) t+=`Flags: ${flags.join('; ')}\n`;
  t+=`Feel: ${p.feel||'-'}/5${p.notes?` | Notes: ${p.notes}`:''}`;return t;
}

/* ---------- PROGRESS ---------- */
function spark(vals){
  if(vals.length<2) return `<span class="sets-note">${vals.length?'1 session':'no data'}</span>`;
  const w=110,h=34,mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*(w-6)+3},${h-4-((v-mn)/sp)*(h-8)}`).join(' ');
  return `<svg width="${w}" height="${h}" role="img" aria-label="trend"><polyline fill="none" stroke="var(--plate)" stroke-width="2.5" points="${pts}"/></svg>`;
}
function renderProgress(){
  const ss=allSessions().sort((a,b)=>b.session-a.session);
  let html=`<h2 style="font-size:22px;margin:6px 0 2px">Anchor lifts</h2><p class="sets-note" style="margin:0 0 4px">Top weight per session, kg. These stay the same all 12 weeks.</p><div class="card">`;
  ANCHORS.forEach(n=>{const h=perSession(n,-1);const first=h[0]?.top,last=h.at(-1)?.top;
    html+=`<div class="spark"><div><b>${n}</b><div class="sets-note">${last!=null?`${last} kg${h.length>1?` (${last-first>=0?'+':''}${(last-first).toFixed(1)} since start)`:''}`:'not logged yet'}</div></div>${spark(h.map(x=>x.top))}</div>`;});
  html+=`</div><h2 style="font-size:22px;margin:14px 0 2px">Sessions</h2><div class="card">`;
  html+=ss.length?ss.slice(0,16).map(s=>`<div class="spark"><div><b>#${s.session} · Week ${s.week}</b><div class="sets-note">${s.workout||''}</div></div><span class="sets-note">${s.date||''}${s.feel?` · feel ${s.feel}/5`:''}</span></div>`).join(''):'<p>Nothing logged yet.</p>';
  html+=`</div><p class="sets-note">Full analysis (weekly volume, top weight by exercise) lives in the Analysis tab of your Google Sheet.</p>`;
  $('#progress').innerHTML=html;
}

/* ---------- SETUP ---------- */
function renderSetup(){
  $('#setup').innerHTML=`<div class="card"><h3>Connect your Google Sheet</h3>
  <label class="f" style="margin-top:10px">Apps Script web app URL</label><input id="cfgUrl" type="url" value="${cfg.url}" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="f" style="margin-top:10px">Secret token (same as the TOKEN script property)</label><input id="cfgTok" type="password" value="${cfg.token}">
  <label class="f" style="margin-top:10px">First session to log (9 = Week 3, Day 1)</label><input id="cfgStart" type="number" min="1" max="48" value="${cfg.start}">
  <button class="primary" id="cfgSave">Save and sync</button><div class="status" id="cfgStatus"></div>
  <p class="sets-note">URL and token are stored only in this browser, not in the page's code, so a public GitHub repo does not expose them.</p></div>`;
}

/* ---------- SYNC ---------- */
function setStatus(){const el=$('#status');if(!el)return;
  el.className='status'+(online===false?' bad':'');
  el.textContent=!cfg.url?'Not connected: sessions save on this device only. Open Setup.':online===false?'Offline or sync error. Your data is safe on this device and will resend.':pending.length?`${pending.length} session(s) waiting to sync.`:'Synced with Google Sheets.';}
async function send(p){
  if(!cfg.url){setStatus();return;}
  try{await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,...p})});}catch(e){online=false;setStatus();return;}
  setTimeout(pull,1800);
}
async function pull(){
  if(!cfg.url){setStatus();return false;}
  try{
    const r=await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token));const j=await r.json();
    if(j.error) throw new Error(j.error);
    server=j;lset('sts_cache',JSON.stringify(j));online=true;
    const have=new Set(j.sessions.map(s=>+s.session));
    const before=pending.length;pending=pending.filter(p=>!have.has(p.session));lset('sts_pending',JSON.stringify(pending));
    pending.forEach(p=>send2(p)); setStatus(); return true;
  }catch(e){online=false;setStatus();return false;}
}
function send2(p){fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,...p})}).catch(()=>{});}

/* ---------- EVENTS ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200);}
document.addEventListener('input',e=>{
  const k=e.target.dataset?.k;
  if(k){draft.v[k]=e.target.value;saveDraft();updateFlag(+k.split('_')[0]);}
  if(e.target.id==='feel'){draft.feel=e.target.value;saveDraft();}
  if(e.target.id==='notes'){draft.notes=e.target.value;saveDraft();}
});
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset?.tab){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b===t));
    ['today','progress','setup'].forEach(id=>$('#'+id).hidden=id!==t.dataset.tab);
    if(t.dataset.tab==='progress')renderProgress(); if(t.dataset.tab==='setup')renderSetup();}
  if(t.dataset?.use!==undefined){const ei=+t.dataset.use;for(let si=0;si<S.list[ei].sets;si++){draft.v[`${ei}_${si}_w`]=t.dataset.w;}saveDraft();renderToday();}
  if(t.id==='finish')finish();
  if(t.id==='copy'){try{await navigator.clipboard.writeText($('#logtxt').textContent);toast('Log copied');}catch(x){toast('Select the text and copy it')}}
  if(t.id==='ovGo'){override=(+$('#ovW').value-1)*4+ +$('#ovD').value+1;renderToday();}
  if(t.id==='cfgSave'){cfg.url=$('#cfgUrl').value.trim();cfg.token=$('#cfgTok').value;cfg.start=+$('#cfgStart').value||9;
    lset('sts_url',cfg.url);lset('sts_token',cfg.token);lset('sts_start',cfg.start);
    $('#cfgStatus').textContent='Syncing…';const ok=await pull();$('#cfgStatus').textContent=ok?'Connected.':'Could not connect. Check the URL, token and that the web app is deployed for "Anyone".';renderToday();}
});

renderToday();renderProgress();
pull().then(()=>{if(!override&&!Object.keys(draft.v||{}).length)renderToday();});
</script>
</body>
